<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>About Me</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        /* Wrapper Foto Asli (Hanya menyisakan bingkai) */
        .retro-img-wrapper {
            position: relative;
            width: 76px;
            height: 90px;
            flex-shrink: 0;
            border: 2px solid #f97316;
            padding: 2px;
            background-color: #000;
        }

        .retro-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body class="text-[11px] text-gray-500 p-4 sm:p-5 h-full flex flex-col">
    <!-- Header Halaman -->
    <div class="flex justify-between text-gray-600 mb-4 uppercase tracking-widest text-[9px] flex-shrink-0">
        <span class="text-orange-500 font-bold">/ABOUT</span>
        <span>INDEX 01</span>
    </div>

    <!-- Area Konten -->
    <div class="flex-1 overflow-y-auto pr-2 space-y-4">

        <!-- Baris Flex: Teks di Kiri, Foto di Kanan -->
        <div class="flex items-start justify-between space-x-3">
            <div class="flex-1">
                <h1 class="text-orange-500 font-bold mb-1">Hello, I'm Muhammad Habib Al Azmi.</h1>
                <p class="text-gray-400 leading-relaxed text-[10px]">
                    Web Developer and Computer Science student at Politeknik Caltex Riau, specializing in web development, security systems,
                    and IoT solutions.
                </p>
            </div>

            <!-- Bungkus Gambar (Tanpa Filter) -->
            <div class="retro-img-wrapper">
                <img src="images/me.jpeg" alt="Areeb Profile" class="retro-img">
            </div>
        </div>

        <!-- Info Tambahan -->
        <div>
            <div class="text-orange-500 mb-1">> Tech Stack</div>
            <ul class="text-gray-400 space-y-1 text-[10px]">
                <li>- Laravel, PHP</li>
                <li>- Tailwind CSS, HTML</li>
                <li>- Linux, OS</li>
                <li>- IoT (MQTT, ESP)</li>
            </ul>
        </div>

    </div>

    <!-- Footer Halaman -->
    <div class="mt-4 pt-2 border-t border-gray-800/50 text-orange-500 flex-shrink-0">
        <span class="mr-2">&gt;</span> loaded
    </div>
</body>

</html>
