<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Portfolio UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
    
        @media (min-width: 640px) {
            .desktop-auto-scale {
                --scale-factor: min(calc((100vh - 100px) / 680), calc((100vw - 100px) / 360));
                transform: scale(var(--scale-factor));
                transform-origin: center center;
            }
        }
    
        /* --- EFEK ANIMASI CRT / TV TABUNG (PERSIS SEPERTI REFERENSI) --- */
        .crt-on {
            animation: crtTurnOn 0.72s ease-out forwards;
        }
    
        @keyframes crtTurnOn {
            0% {
                filter: brightness(3.5) contrast(0.4);
                transform: scaleY(0.004);
                opacity: 0;
            }
    
            22% {
                transform: scaleY(0.02);
                opacity: 1;
            }
    
            40% {
                filter: brightness(1.6);
                transform: scaleY(1);
            }
    
            55% {
                filter: brightness(0.7);
            }
    
            70% {
                filter: brightness(1.3);
            }
    
            100% {
                filter: brightness(1);
                transform: scaleY(1);
                opacity: 1;
            }
        }
    
        .crt-off {
            animation: crtTurnOff 0.62s ease-in forwards;
        }
    
        @keyframes crtTurnOff {
            0% {
                filter: brightness(1);
                transform: scaleY(1);
                opacity: 1;
            }
    
            30% {
                filter: brightness(1.3);
                transform: scaleY(1);
            }
    
            45% {
                filter: brightness(0.7);
                transform: scaleY(1);
            }
    
            60% {
                filter: brightness(1.6);
                transform: scaleY(1);
            }
    
            82% {
                filter: brightness(3.5) contrast(0.4);
                transform: scaleY(0.02);
                opacity: 1;
            }
    
            100% {
                filter: brightness(3.5) contrast(0.4);
                transform: scaleY(0.004);
                opacity: 0;
            }
        }
    </style>
</head>

<body
    class="bg-[#121214] sm:flex sm:items-center sm:justify-center h-[100dvh] w-full m-0 p-0 overflow-hidden overscroll-none">

    <div
        class="w-full h-full sm:w-[360px] sm:h-[680px] desktop-auto-scale bg-gradient-to-b from-gray-800 to-gray-950 sm:rounded-[45px] sm:shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] sm:border sm:border-gray-700/50 relative flex flex-col p-4 sm:p-5 flex-shrink-0 transition-transform duration-300">

        <div class="flex justify-between items-center px-2 pt-1 pb-3 flex-shrink-0">
            <div class="text-orange-500 font-bold text-xl tracking-tighter">
                Izumi
                <span class="text-gray-500 text-[10px] ml-1 font-normal tracking-normal uppercase">v3.0</span>
            </div>
            <div class="flex space-x-1.5 opacity-50 hidden sm:flex">
                <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
                <div class="w-1 h-1 bg-gray-400 rounded-full"></div>
            </div>
            <div></div>
        </div>

        <div
            class="flex-1 min-h-0 sm:flex-none sm:h-[380px] bg-black rounded-3xl p-1 border-[4px] border-[#111] shadow-inner relative flex flex-col justify-center items-center overflow-hidden">

            <!-- Pemberitahuan Saat Layar Mati -->
            <div id="power-off-message"
                class="absolute flex flex-col items-center justify-center text-gray-700 font-mono-custom font-bold tracking-[0.2em] text-[11px] z-0 opacity-80">
                <div class="mb-3">PRESS POWER</div>
                <div class="text-[9px]">OR PUSH <span class="border border-gray-700 rounded px-1.5 py-0.5 ml-1">P</span>
                </div>
            </div>

            <!-- Kontainer Layar Utama (Animasi CRT TV diatur di class ini) -->
            <div id="screen-container"
                class="bg-[#0a0a05] w-full h-full rounded-[16px] sm:rounded-[20px] shadow-[inset_0_0_20px_rgba(249,115,22,0.02)] origin-center overflow-hidden relative z-10 crt-off">
                <iframe id="screen-frame" src="about.html"
                    class="w-full h-full border-none pointer-events-none sm:pointer-events-auto bg-transparent relative z-10"></iframe>
            </div>
        </div>

        <!-- Area Kontrol -->
        <div
            class="h-[150px] sm:h-[140px] flex justify-between items-center px-2 sm:px-4 mt-4 pb-2 sm:pb-0 relative flex-shrink-0">
            <div class="flex flex-col items-center space-y-3 transform translate-y-1">
                <button id="power-btn"
                    class="w-2.5 h-10 sm:h-12 rounded-full transition-all duration-300 active:scale-95 bg-gradient-to-b from-gray-700 to-gray-900 shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] border-gray-700/50"></button>
                <span class="text-[9px] text-gray-500 tracking-widest uppercase font-mono-custom">Power</span>
            </div>

            <!-- D-Pad -->
            <div
                class="w-36 h-36 sm:w-32 sm:h-32 bg-[#1e1e24] rounded-full shadow-[inset_0_4px_10px_rgba(0,0,0,0.6),0_10px_20px_rgba(0,0,0,0.5)] flex items-center justify-center relative border border-gray-700/50">
                <button id="center-btn"
                    class="w-12 h-12 sm:w-12 sm:h-12 bg-gradient-to-b from-gray-700 to-gray-800 rounded-full shadow-[0_5px_10px_rgba(0,0,0,0.6),inset_0_1px_2px_rgba(255,255,255,0.1)] active:shadow-[inset_0_5px_10px_rgba(0,0,0,0.9)] transition-all z-10 flex items-center justify-center">
                    <div id="center-indicator" class="w-2 h-2 rounded-full bg-transparent transition-colors"></div>
                </button>

                <button data-direction="top"
                    class="absolute top-1 left-1/2 -translate-x-1/2 w-12 h-12 sm:w-10 sm:h-10 flex items-center justify-center hover:scale-110 active:scale-90 transition-all z-0 group">
                    <div id="icon-top" class="text-gray-500 transition-colors">
                        <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </button>
                <button data-direction="right"
                    class="absolute right-1 top-1/2 -translate-y-1/2 w-12 h-12 sm:w-10 sm:h-10 flex items-center justify-center hover:scale-110 active:scale-90 transition-all z-0 group">
                    <div id="icon-right" class="text-gray-500 transition-colors">
                        <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222">
                            </path>
                        </svg>
                    </div>
                </button>
                <button data-direction="bottom"
                    class="absolute bottom-1 left-1/2 -translate-x-1/2 w-12 h-12 sm:w-10 sm:h-10 flex items-center justify-center hover:scale-110 active:scale-90 transition-all z-0 group">
                    <div id="icon-bottom" class="text-gray-500 transition-colors">
                        <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </div>
                </button>
                <button data-direction="left"
                    class="absolute left-1 top-1/2 -translate-y-1/2 w-12 h-12 sm:w-10 sm:h-10 flex items-center justify-center hover:scale-110 active:scale-90 transition-all z-0 group">
                    <div id="icon-left" class="text-gray-500 transition-colors">
                        <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
                            </path>
                        </svg>
                    </div>
                </button>
            </div>

            <!-- Menu & Back -->
            <div class="flex space-x-3 sm:space-x-5 transform translate-y-3">
                <div class="flex flex-col items-center space-y-3">
                    <button id="menu-btn"
                        class="w-2.5 h-7 sm:h-9 bg-gradient-to-b from-gray-500 to-gray-700 rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)] border border-gray-600/50 hover:bg-gray-400 transition-colors active:scale-95"></button>
                    <span class="text-[9px] text-gray-500 tracking-widest uppercase font-mono-custom">Menu</span>
                </div>
                <div class="flex flex-col items-center space-y-3">
                    <button id="back-btn"
                        class="w-2.5 h-7 sm:h-9 bg-gradient-to-b from-orange-600 to-orange-800 rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.4),0_0_8px_rgba(249,115,22,0.4)] border border-orange-900/50 active:scale-95"></button>
                    <span class="text-[9px] text-gray-500 tracking-widest uppercase font-mono-custom">Back</span>
                </div>
            </div>
        </div>

        <div
            class="mt-auto pt-2 pb-3 sm:absolute sm:-bottom-8 sm:w-full text-center text-[10px] text-gray-600 tracking-[0.2em] uppercase font-mono-custom sm:pb-0 flex-shrink-0">
            Copyright 2026 &copy; - Muhammad Habib Al Azmi
        </div>
    </div>

    <!-- Elemen Player Musik (Tidak terlihat di layar) -->
    <audio id="bg-music-player" loop></audio>

    <script>
        var isPowerOn = false;
        var isNavMode = false;
        var basePage = 'about.html';
        var currentScreen = 'about.html';
        var preMenuNavMode = false;
        var screenBeforeMenu = 'about.html';

        const powerBtn = document.getElementById('power-btn');
        const menuBtn = document.getElementById('menu-btn');
        const backBtn = document.getElementById('back-btn');
        const screenContainer = document.getElementById('screen-container');
        const frame = document.getElementById('screen-frame');

        const elTop = document.getElementById('icon-top');
        const elRight = document.getElementById('icon-right');
        const elBottom = document.getElementById('icon-bottom');
        const elLeft = document.getElementById('icon-left');
        const centerIndicator = document.getElementById('center-indicator');

        const icons = {
            menu: {
                top: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`,
                right: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>`,
                bottom: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`,
                left: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>`
            },
            arrow: {
                top: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>`,
                right: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>`,
                bottom: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>`,
                left: `<svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>`
            }
        };

        function updateActiveIcon(direction) {
            [elTop, elRight, elBottom, elLeft].forEach(el => el.className = 'text-gray-500 group-hover:text-gray-400 group-active:text-orange-500 transition-colors');
            if (direction !== 'none') {
                const activeEl = direction === 'top' ? elTop : direction === 'right' ? elRight : direction === 'bottom' ? elBottom : elLeft;
                activeEl.className = 'text-orange-500 drop-shadow-[0_0_5px_rgba(249,115,22,0.8)] transition-colors';
            }
        }

        function renderDpadIcons() {
            const mode = isNavMode ? 'arrow' : 'menu';
            elTop.innerHTML = icons[mode].top;
            elRight.innerHTML = icons[mode].right;
            elBottom.innerHTML = icons[mode].bottom;
            elLeft.innerHTML = icons[mode].left;

            if (isNavMode) {
                centerIndicator.classList.add('bg-orange-500', 'shadow-[0_0_8px_#f97316]');
                updateActiveIcon('none');
            } else {
                centerIndicator.classList.remove('bg-orange-500', 'shadow-[0_0_8px_#f97316]');
            }
        }

        function updateBaseIcons() {
            if (isNavMode) { updateActiveIcon('none'); return; }
            if (basePage === 'about.html') updateActiveIcon('top');
            else if (basePage === 'education.html') updateActiveIcon('right');
            else if (basePage === 'experiences.html') updateActiveIcon('bottom');
            else if (basePage === 'contact.html') updateActiveIcon('left');
        }

        // --- 1. Logika Power Terpusat dengan Animasi CRT ---
        function togglePower() {
            isPowerOn = !isPowerOn;
            if (isPowerOn) {
                // Terapkan Animasi Hidup (TV Tabung)
                screenContainer.classList.remove('crt-off');
                screenContainer.classList.add('crt-on');

                // Styling Tombol Power ON
                powerBtn.classList.add('from-orange-400', 'to-orange-600', 'shadow-[0_0_15px_rgba(249,115,22,0.6)]', 'border-orange-300/30');
                powerBtn.classList.remove('from-gray-700', 'to-gray-900', 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]', 'border-gray-700/50');

                isNavMode = false;
                basePage = 'about.html';
                currentScreen = basePage;
                frame.src = basePage;
                renderDpadIcons();
                updateBaseIcons();
            } else {
                // Terapkan Animasi Mati (TV Tabung)
                screenContainer.classList.remove('crt-on');
                screenContainer.classList.add('crt-off');

                // Styling Tombol Power OFF
                powerBtn.classList.remove('from-orange-400', 'to-orange-600', 'shadow-[0_0_15px_rgba(249,115,22,0.6)]', 'border-orange-300/30');
                powerBtn.classList.add('from-gray-700', 'to-gray-900', 'shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]', 'border-gray-700/50');
                updateActiveIcon('none');
            }

            // Panggil kontrol musik
            handleScreenPower(isPowerOn);
        }

        // Jalankan via Klik Mouse
        powerBtn.addEventListener('click', togglePower);

        // Jalankan via Keyboard 'P'
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') {
                togglePower();
            }
        });

        // --- 2. Logika MENU Button ---
        menuBtn.addEventListener('click', () => {
            if (!isPowerOn) return;

            if (currentScreen.startsWith('games/') && frame.contentWindow && frame.contentWindow.handleMenuButton) {
                frame.contentWindow.handleMenuButton();
                return;
            }

            if (currentScreen === 'menu.html' || currentScreen === 'games.html') {
                currentScreen = screenBeforeMenu;
                isNavMode = preMenuNavMode;
                frame.src = currentScreen;
                renderDpadIcons();
                updateBaseIcons();
            } else {
                screenBeforeMenu = currentScreen;
                preMenuNavMode = isNavMode;
                isNavMode = true;
                currentScreen = 'menu.html';
                frame.src = currentScreen;
                renderDpadIcons();
            }
        });

        // --- 3. Logika BACK Button ---
        backBtn.addEventListener('click', () => {
            if (!isPowerOn) return;

            if (frame.contentWindow && typeof frame.contentWindow.handleBackButton === 'function') {
                frame.contentWindow.handleBackButton();
                return;
            }

            if (currentScreen === 'games.html') {
                currentScreen = 'menu.html';
                isNavMode = true;
                frame.src = currentScreen;
                renderDpadIcons();
            } else if (currentScreen === 'menu.html') {
                currentScreen = basePage;
                isNavMode = preMenuNavMode;
                frame.src = basePage;
                renderDpadIcons();
                updateBaseIcons();
            } else if (currentScreen.startsWith('games/')) {
                window.goToGames();
            }
        });

        // --- 4. Logika D-Pad Center ---
        document.getElementById('center-btn').addEventListener('click', () => {
            if (!isPowerOn) return;

            if (currentScreen === 'menu.html' || currentScreen === 'games.html' || currentScreen.startsWith('games/')) {
                if (frame.contentWindow && frame.contentWindow.handleMenuInput) {
                    frame.contentWindow.handleMenuInput('center'); return;
                }
                if (frame.contentWindow && frame.contentWindow.handleArrowInput) {
                    frame.contentWindow.handleArrowInput('center'); return;
                }
            }

            isNavMode = !isNavMode;
            renderDpadIcons();
            updateBaseIcons();
        });

        // --- 5. Logika D-Pad Panah ---
        function handleDpadAction(direction) {
            if (!isPowerOn) return;

            if (currentScreen === 'menu.html' || currentScreen === 'games.html' || currentScreen.startsWith('games/')) {
                if (frame.contentWindow && frame.contentWindow.handleMenuInput) {
                    frame.contentWindow.handleMenuInput(direction); return;
                }
                if (frame.contentWindow && frame.contentWindow.handleArrowInput) {
                    frame.contentWindow.handleArrowInput(direction); return;
                }
            }

            if (isNavMode) {
                const iframeWin = frame.contentWindow;

                if (iframeWin && typeof iframeWin.handleArrowInput === 'function') {
                    iframeWin.handleArrowInput(direction);
                } else {
                    if (direction === 'top') iframeWin.scrollBy({ top: -60, behavior: 'smooth' });
                    if (direction === 'bottom') iframeWin.scrollBy({ top: 60, behavior: 'smooth' });
                    if (direction === 'left') iframeWin.scrollBy({ left: -60, behavior: 'smooth' });
                    if (direction === 'right') iframeWin.scrollBy({ left: 60, behavior: 'smooth' });
                }
            } else {
                const pages = { top: 'about.html', right: 'education.html', bottom: 'experiences.html', left: 'contact.html' };
                if (pages[direction]) {
                    basePage = pages[direction];
                    currentScreen = basePage;
                    frame.src = basePage;
                    updateActiveIcon(direction);
                }
            }
        }

        // --- EXPORT FUNGSI UNTUK IFRAME ---
        window.goToGames = function () {
            currentScreen = 'games.html';
            isNavMode = true;
            frame.src = currentScreen;
            renderDpadIcons();
        };

        window.goToGame = function (url) {
            currentScreen = url;
            isNavMode = true;
            frame.src = currentScreen;
            renderDpadIcons();
        };

        // --- 6. Logika HOLD Panah ---
        function isInsideGame() {
            return currentScreen.startsWith('games/');
        }

        let holdTimeout = null;
        let holdInterval = null;

        function stopDpadHold() {
            if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
            if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
        }

        function startDpadHold(direction) {
            stopDpadHold();

            handleDpadAction(direction);

            if (!isInsideGame()) return;

            holdTimeout = setTimeout(() => {
                holdInterval = setInterval(() => {
                    if (!isInsideGame()) { stopDpadHold(); return; }
                    handleDpadAction(direction);
                }, 70);
            }, 250);
        }

        document.querySelectorAll('[data-direction]').forEach((btn) => {
            const direction = btn.dataset.direction;

            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                startDpadHold(direction);
            });
            btn.addEventListener('pointerup', stopDpadHold);
            btn.addEventListener('pointerleave', stopDpadHold);
            btn.addEventListener('pointercancel', stopDpadHold);
        });

        // --- 7. LOGIKA MUSIK ---
        function applyMusicSettings() {
            // JANGAN MAIN JIKA LAYAR MATI
            if (!isPowerOn) return;

            const bgAudio = document.getElementById('bg-music-player');

            const musicIdx = parseInt(localStorage.getItem('music_idx') || 0);
            const volIdx = parseInt(localStorage.getItem('volume_idx') || 1);

            const tracks = [
                '',
                'music/Knight day hills.ogg',
                'music/Party day encampment.ogg'
            ];

            let volume = 0;
            if (volIdx === 1) volume = 0.3;
            else if (volIdx === 2) volume = 1.0;

            bgAudio.volume = volume;

            let selectedTrack = tracks[musicIdx];

            if (musicIdx === 0 || volume === 0) {
                bgAudio.pause();
            } else {
                if (!bgAudio.src.endsWith(encodeURI(selectedTrack))) {
                    bgAudio.src = selectedTrack;
                    bgAudio.play().catch(e => console.log('Autoplay tertahan.'));
                } else if (bgAudio.paused) {
                    bgAudio.play().catch(e => console.log('Autoplay tertahan.'));
                }
            }
        }

        function handleScreenPower(isPowerOnState) {
            const bgAudio = document.getElementById('bg-music-player');
            if (!isPowerOnState) {
                bgAudio.pause();
            } else {
                applyMusicSettings();
            }
        }
    </script>
</body>

</html>
