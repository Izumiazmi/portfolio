<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Breakout Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: transparent;
        }

        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>

<body class="text-[11px] text-gray-500 p-2 m-0 w-full h-full overflow-hidden flex flex-col box-border">

    <!-- Header Game -->
    <div class="flex justify-between w-full mb-1.5 text-[10px] uppercase tracking-widest font-bold flex-shrink-0">
        <span class="text-orange-500">BREAKOUT</span>
        <span id="score-text" class="text-gray-400">SCORE: 0</span>
    </div>

    <!-- Papan Game Dinamis -->
    <div id="board-container"
        class="relative w-full flex-1 rounded border border-gray-800 shadow-[inset_0_0_20px_rgba(0,0,0,1)] bg-[#050505] overflow-hidden">

        <canvas id="gameCanvas" class="block w-full h-full"></canvas>

        <!-- Menu Overlay -->
        <div id="pause-menu"
            class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-10 transition-opacity">
            <div id="pause-title"
                class="text-orange-500 font-bold mb-6 tracking-widest text-lg drop-shadow-[0_0_8px_rgba(249,115,22,0.8)]">
                BREAKOUT</div>
            <ul id="pause-list" class="space-y-3 text-[10px] font-bold tracking-widest uppercase">
                <!-- List menu dirender di JS -->
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const boardContainer = document.getElementById('board-container');
        const scoreText = document.getElementById('score-text');

        let animationId; // Untuk kontrol frame rate
        let score = 0;

        // Objek Game
        const paddle = { w: 60, h: 8, x: 0, y: 0 };
        const ball = { r: 4, x: 0, y: 0, dx: 3, dy: -3, speed: 3 };

        const brickInfo = {
            rows: 5, cols: 6, w: 0, h: 12, padding: 4, offsetTop: 25, offsetLeft: 10
        };
        let bricks = [];

        function resizeCanvas() {
            canvas.width = boardContainer.clientWidth;
            canvas.height = boardContainer.clientHeight;

            // Posisi awal Paddle & Bola
            paddle.y = canvas.height - 20;
            if (gameState === 'READY' || gameState === 'GAMEOVER') {
                paddle.x = (canvas.width - paddle.w) / 2;
                ball.x = canvas.width / 2;
                ball.y = paddle.y - ball.r - 2;
            }

            // Hitung lebar bata agar pas di layar
            brickInfo.w = (canvas.width - (brickInfo.offsetLeft * 2) - (brickInfo.padding * (brickInfo.cols - 1))) / brickInfo.cols;
        }

        function createBricks() {
            bricks = [];
            for (let r = 0; r < brickInfo.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickInfo.cols; c++) {
                    bricks[r][c] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        // Sistem Menu State
        let gameState = 'READY'; // READY, PLAYING, PAUSED, GAMEOVER, VICTORY
        let menuOptions = [];
        let menuIdx = 0;

        function renderMenu() {
            const menuEl = document.getElementById('pause-menu');
            const listEl = document.getElementById('pause-list');
            const titleEl = document.getElementById('pause-title');

            if (gameState === 'PLAYING') {
                menuEl.classList.add('hidden');
                return;
            }

            menuEl.classList.remove('hidden');

            if (gameState === 'READY') {
                titleEl.innerText = 'BREAKOUT';
                titleEl.className = "text-orange-500 font-bold mb-6 tracking-widest text-lg drop-shadow-[0_0_8px_rgba(249,115,22,0.8)]";
                menuOptions = [
                    { label: 'START GAME', action: 'start' },
                    { label: 'EXIT TO GAMES', action: 'exit' }
                ];
            } else if (gameState === 'PAUSED') {
                titleEl.innerText = 'PAUSED';
                titleEl.className = "text-gray-400 font-bold mb-6 tracking-widest text-lg";
                menuOptions = [
                    { label: 'RESUME', action: 'resume' },
                    { label: 'RESTART', action: 'start' },
                    { label: 'EXIT TO GAMES', action: 'exit' }
                ];
            } else if (gameState === 'GAMEOVER') {
                titleEl.innerText = 'GAME OVER';
                titleEl.className = "text-red-500 font-bold mb-6 tracking-widest text-lg drop-shadow-[0_0_8px_rgba(239,68,68,0.8)]";
                menuOptions = [
                    { label: 'TRY AGAIN', action: 'start' },
                    { label: 'EXIT TO GAMES', action: 'exit' }
                ];
            } else if (gameState === 'VICTORY') {
                titleEl.innerText = 'YOU WIN';
                titleEl.className = "text-orange-400 font-bold mb-6 tracking-widest text-lg drop-shadow-[0_0_8px_rgba(251,146,60,0.8)]";
                menuOptions = [
                    { label: 'PLAY AGAIN', action: 'start' },
                    { label: 'EXIT TO GAMES', action: 'exit' }
                ];
            }

            if (menuIdx >= menuOptions.length) menuIdx = menuOptions.length - 1;

            listEl.innerHTML = '';
            menuOptions.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = "flex items-center space-x-2";
                const cursor = idx === menuIdx ? '<span class="text-orange-500 animate-pulse">&gt;</span>' : '<span class="opacity-0">&gt;</span>';
                const textClass = idx === menuIdx ? 'text-gray-200' : 'text-gray-600';
                li.innerHTML = `${cursor} <span class="${textClass}">${opt.label}</span>`;
                listEl.appendChild(li);
            });
        }

        function executeMenuAction() {
            const action = menuOptions[menuIdx].action;
            if (action === 'start') {
                resetGame();
                gameState = 'PLAYING';
                renderMenu();
                gameLoop();
            } else if (action === 'resume') {
                gameState = 'PLAYING';
                renderMenu();
                gameLoop();
            } else if (action === 'exit') {
                window.parent.goToGames();
            }
        }

        function resetGame() {
            paddle.x = (canvas.width - paddle.w) / 2;
            ball.x = canvas.width / 2;
            ball.y = paddle.y - ball.r - 2;
            // Memulai dengan lemparan bola secara acak (sedikit serong)
            ball.dx = Math.random() > 0.5 ? ball.speed : -ball.speed;
            ball.dy = -ball.speed;
            score = 0;
            scoreText.innerText = `SCORE: 0`;
            createBricks();
        }

        function drawPaddle() {
            ctx.fillStyle = '#f97316';
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = '#d1d5db';
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let r = 0; r < brickInfo.rows; r++) {
                for (let c = 0; c < brickInfo.cols; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        let bX = (c * (brickInfo.w + brickInfo.padding)) + brickInfo.offsetLeft;
                        let bY = (r * (brickInfo.h + brickInfo.padding)) + brickInfo.offsetTop;
                        b.x = bX;
                        b.y = bY;

                        // Buat baris paling atas warna abu-abu, sisanya oranye
                        ctx.fillStyle = r === 0 ? '#9ca3af' : '#ea580c';
                        ctx.fillRect(bX, bY, brickInfo.w, brickInfo.h);
                    }
                }
            }
        }

        function collisionDetection() {
            for (let r = 0; r < brickInfo.rows; r++) {
                for (let c = 0; c < brickInfo.cols; c++) {
                    let b = bricks[r][c];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + brickInfo.w && ball.y > b.y && ball.y < b.y + brickInfo.h) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            scoreText.innerText = `SCORE: ${score}`;

                            if (score === brickInfo.rows * brickInfo.cols * 10) {
                                gameState = 'VICTORY';
                                renderMenu();
                            }
                        }
                    }
                }
            }
        }

        function moveEntities() {
            // Posisi paddle sudah diatur langsung di handleArrowInput (per klik panah),
            // di sini cukup pastikan tetap berada dalam batas papan.
            if (paddle.x < 0) { paddle.x = 0; }
            if (paddle.x + paddle.w > canvas.width) { paddle.x = canvas.width - paddle.w; }

            // Pergerakan Bola
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Pantul Dinding Kiri/Kanan
            if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) { ball.dx = -ball.dx; }
            // Pantul Atap
            if (ball.y - ball.r < 0) { ball.dy = -ball.dy; }

            // Pantul Paddle
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h) {
                ball.dy = -ball.speed;
                // Membelokkan bola tergantung di mana ia menabrak paddle
                let hitPoint = ball.x - (paddle.x + paddle.w / 2);
                ball.dx = hitPoint * 0.15;
            }

            // Jatuh (Game Over)
            if (ball.y + ball.r > canvas.height) {
                gameState = 'GAMEOVER';
                renderMenu();
            }
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawPaddle();
            drawBall();
            collisionDetection();
            moveEntities();

            if (gameState === 'PLAYING') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // --- PENANGANAN INPUT D-PAD ---
        const paddleStep = 22; // Jarak geser paddle setiap kali panah ditekan

        window.handleArrowInput = function (action) {
            if (gameState === 'PLAYING') {
                // Gameplay Controls: Setiap tekan panah menggeser paddle sedikit (bukan bergerak terus-menerus)
                if (action === 'left') {
                    paddle.x = Math.max(0, paddle.x - paddleStep);
                }
                if (action === 'right') {
                    paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddleStep);
                }

            } else {
                // Menu Navigation Controls
                if (action === 'top') {
                    menuIdx = Math.max(0, menuIdx - 1);
                    renderMenu();
                } else if (action === 'bottom') {
                    menuIdx = Math.min(menuOptions.length - 1, menuIdx + 1);
                    renderMenu();
                } else if (action === 'center') {
                    executeMenuAction();
                }
            }
        };

        window.handleMenuButton = function () {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                cancelAnimationFrame(animationId);
                menuIdx = 0;
                renderMenu();
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                renderMenu();
                gameLoop();
            }
        };

        // Inisialisasi awal
        resizeCanvas();
        createBricks();
        drawBricks();
        drawPaddle();
        drawBall();
        renderMenu();

        // Responsive resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (gameState !== 'PLAYING') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBricks();
                drawPaddle();
                drawBall();
            }
        });
    </script>
</body>

</html>
