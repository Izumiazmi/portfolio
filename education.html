<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Education</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="text-[11px] text-gray-500 p-4 sm:p-5 h-full flex flex-col relative overflow-hidden">

    <!-- Header Halaman -->
    <div class="flex justify-between text-gray-600 mb-4 uppercase tracking-widest text-[9px] flex-shrink-0">
        <span class="text-orange-500 font-bold">/EDUCATION</span>
        <span>INDEX 02</span>
    </div>

    <!-- Area Konten yang Bisa di Scroll Vertikal -->
    <div id="scroll-area" class="flex-1 overflow-y-auto pr-2 space-y-4">

        <!-- Riwayat Pendidikan -->
        <div class="border-l-2 border-orange-500/30 pl-3">
            <h2 class="text-orange-500 font-bold">Politeknik Caltex Riau</h2>
            <p class="text-gray-400">Developer / Computer Science</p>
            <p class="text-gray-600 text-[9px] mt-1">2024 - Present</p>
        </div>

        <div class="border-l-2 border-gray-700 pl-3">
            <h2 class="text-gray-400 font-bold">SMKN 4 Kota Bengkulu</h2>
            <p class="text-gray-500">Software Engineering</p>
            <p class="text-gray-600 text-[9px] mt-1">2021 - 2024</p>
        </div>

        <!-- Pemisah Visual -->
        <div class="border-t border-gray-800/50 pt-3 mt-4">
            <h2 class="text-orange-500 font-bold mb-2 uppercase tracking-widest text-[9px]">/CERTIFICATIONS</h2>

            <!-- Area Slider Sertifikat -->
            <div class="relative w-full">
                <!-- PERBAIKAN 1: Tombol Navigasi Virtual (kiri & kanan) telah dihapus dari sini -->

                <!-- Container Gambar (Scroll Horizontal) -->
                <div id="cert-container"
                    class="flex space-x-2 overflow-x-auto hide-scroll scroll-smooth snap-x snap-mandatory py-1">

                    <!-- PERBAIKAN 2: Mengubah h-auto menjadi h-full pada setiap elemen <img> agar mengisi penuh bingkai yang merenggang -->
                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/1.jpg" alt="Sertifikat 1" class="w-full h-full object-cover">
                    </div>

                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/2.jpg" alt="Sertifikat 2" class="w-full h-full object-cover">
                    </div>

                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/3.png" alt="Sertifikat 3" class="w-full h-full object-cover">
                    </div>

                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/4.jpg" alt="Sertifikat 4" class="w-full h-full object-cover">
                    </div>

                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/5.jpg" alt="Sertifikat 5" class="w-full h-full object-cover">
                    </div>

                    <div
                        class="cert-item flex-shrink-0 w-[45%] snap-center rounded overflow-hidden border-2 transition-all duration-300 flex flex-col">
                        <img src="images/sertif/6.png" alt="Sertifikat 6" class="w-full h-full object-cover">
                    </div>

                </div>
            </div>
            <!-- INSTRUKSI DIUBAH -->
            <p class="text-gray-600 text-[8px] mt-2 text-center">Use <span class="text-orange-500">LEFT/RIGHT</span>
                to slide | <span class="text-orange-500">DOWN</span> to select</p>
        </div>
    </div>

    <!-- SCRIPT LOGIKA SLIDER -->
    <script>
        const certContainer = document.getElementById('cert-container');
        const scrollArea = document.getElementById('scroll-area');
        const certs = document.querySelectorAll('.cert-item');

        let selectedIdx = 0;

        function updateSelection() {
            certs.forEach((cert, idx) => {
                if (idx === selectedIdx) {
                    cert.classList.remove('border-gray-700', 'opacity-50');
                    cert.classList.add('border-orange-500', 'opacity-100');
                    cert.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    cert.classList.remove('border-orange-500', 'opacity-100');
                    cert.classList.add('border-gray-700', 'opacity-50');
                }
            });
        }

        window.onload = () => {
            setTimeout(() => {
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 150);
            updateSelection();
        };

        window.handleArrowInput = function (action) {
            if (action === 'left') {
                selectedIdx = Math.max(0, selectedIdx - 1);
                updateSelection();
                return;
            } else if (action === 'right') {
                selectedIdx = Math.min(certs.length - 1, selectedIdx + 1);
                updateSelection();
                return;
            } else if (action === 'bottom') {
                const targetFile = 'sertif/' + (selectedIdx + 1) + '.html';
                window.parent.currentScreen = targetFile;
                window.parent.screenBeforeMenu = targetFile;
                window.location.href = targetFile;
                return;
            }

            if (action === 'top') {
                scrollArea.scrollBy({ top: -50, behavior: 'smooth' });
            }
        };
    </script>
</body>

</html>
